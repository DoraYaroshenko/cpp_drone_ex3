score_report:
  composition_file: sim_compose.yaml
  simulations:
    - simulation:
        simulation_config: simulation/house_simulation.yaml
        missions:
          - mission:
              mission_config: mission/house_mission_lower.yaml
              runs:
                - drone_config: drone/drone_small.yaml
                  lidar_config: lidar/lidar_long.yaml
                  status: error
                  steps: 0
                  score: -1
                  error_ref:
                    code: SIMULATION_RUN_ERROR
                - drone_config: drone/drone_small.yaml
                  lidar_config: lidar/lidar_short.yaml
                  status: error
                  steps: 0
                  score: -1
                  error_ref:
                    code: SIMULATION_RUN_ERROR
                - drone_config: drone/drone_large.yaml
                  lidar_config: lidar/lidar_long.yaml
                  status: error
                  steps: 0
                  score: -1
                  error_ref:
                    code: SIMULATION_RUN_ERROR
                - drone_config: drone/drone_large.yaml
                  lidar_config: lidar/lidar_short.yaml
                  status: error
                  steps: 0
                  score: -1
                  error_ref:
                    code: SIMULATION_RUN_ERROR
            ? mission:
                mission_config: mission/house_mission_full.yaml
                runs:
                  - drone_config: drone/drone_small.yaml
                    lidar_config: lidar/lidar_long.yaml
                    status: error
                    steps: 0
                    score: -1
                    error_ref:
                      code: SIMULATION_RUN_ERROR
                  - drone_config: drone/drone_small.yaml
                    lidar_config: lidar/lidar_short.yaml
                    status: error
                    steps: 0
                    score: -1
                    error_ref:
                      code: SIMULATION_RUN_ERROR
                  - drone_config: drone/drone_large.yaml
                    lidar_config: lidar/lidar_long.yaml
                    status: error
                    steps: 0
                    score: -1
                    error_ref:
                      code: SIMULATION_RUN_ERROR
                  - drone_config: drone/drone_large.yaml
                    lidar_config: lidar/lidar_short.yaml
                    status: error
                    steps: 0
                    score: -1
                    error_ref:
                      code: SIMULATION_RUN_ERROR
